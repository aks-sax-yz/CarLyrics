name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build unsigned IPA
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Install XcodeGen
        run: brew install xcodegen

      # project.yml is the source of truth; generate so the CarLyrics scheme
      # (including LyricsWidgetExtension) exists. The committed xcodeproj has no shared schemes.
      - name: Generate Xcode project
        run: xcodegen generate

      - name: Read version from project.yml
        id: version
        run: |
          set -euo pipefail
          MARKETING_VERSION=$(sed -n 's/.*MARKETING_VERSION: "\([^"]*\)"/\1/p' project.yml | head -1)
          MIN_OS_VERSION=$(python3 -c '
          import re, pathlib
          text = pathlib.Path("project.yml").read_text()
          m = re.search(r"deploymentTarget:\s*\n\s*iOS:\s*\"([^\"]+)\"", text)
          if not m:
              raise SystemExit("Could not read iOS deployment target from project.yml")
          print(m.group(1))
          ')
          BUILD_VERSION="${{ github.run_number }}"
          TAG="v${MARKETING_VERSION}-${BUILD_VERSION}"
          echo "marketing_version=${MARKETING_VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_version=${BUILD_VERSION}" >> "$GITHUB_OUTPUT"
          echo "min_os_version=${MIN_OS_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Using marketing=${MARKETING_VERSION} build=${BUILD_VERSION} tag=${TAG} minOS=${MIN_OS_VERSION}"

      - name: Build unsigned app
        run: |
          set -euo pipefail
          xcodebuild \
            -project CarLyrics.xcodeproj \
            -scheme CarLyrics \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            MARKETING_VERSION="${{ steps.version.outputs.marketing_version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build_version }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            | xcbeautify --renderer github-actions

      - name: Package IPA
        run: |
          set -euo pipefail
          PRODUCTS="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos"
          APP="$PRODUCTS/CarLyrics.app"
          if [[ ! -d "$APP" ]]; then
            echo "CarLyrics.app not found under $PRODUCTS" >&2
            ls -la "$PRODUCTS" || true
            find "$RUNNER_TEMP/DerivedData/Build/Products" -name "*.app" -o -name "*.appex" >&2 || true
            exit 1
          fi
          echo "App bundle:"
          ls -la "$APP"
          echo "Embedded PlugIns (widget extension, if present):"
          ls -la "$APP/PlugIns" || echo "No PlugIns directory"
          WORK="$RUNNER_TEMP/ipa"
          rm -rf "$WORK"
          mkdir -p "$WORK/Payload"
          cp -R "$APP" "$WORK/Payload/"
          # ditto preserves resource forks / Finder info better than zip for .app bundles
          ditto -c -k --sequesterRsrc --keepParent "$WORK/Payload" "$GITHUB_WORKSPACE/CarLyrics.ipa"
          ls -lh "$GITHUB_WORKSPACE/CarLyrics.ipa"
          # Sanity-check the zip layout SideStore expects
          unzip -l "$GITHUB_WORKSPACE/CarLyrics.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CarLyrics.ipa
          path: CarLyrics.ipa
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          MARKETING_VERSION: ${{ steps.version.outputs.marketing_version }}
          BUILD_VERSION: ${{ steps.version.outputs.build_version }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "Car Lyrics ${MARKETING_VERSION} (${BUILD_VERSION})" \
            --notes "Unsigned IPA for SideStore / AltStore. Marketing version ${MARKETING_VERSION}, build ${BUILD_VERSION}." \
            "CarLyrics.ipa#CarLyrics.ipa"

      - name: Update SideStore source (apps.json)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          MARKETING_VERSION: ${{ steps.version.outputs.marketing_version }}
          BUILD_VERSION: ${{ steps.version.outputs.build_version }}
          MIN_OS_VERSION: ${{ steps.version.outputs.min_os_version }}
        run: |
          set -euo pipefail
          IPA_SIZE=$(wc -c < "$GITHUB_WORKSPACE/CarLyrics.ipa" | tr -d ' ')
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/CarLyrics.ipa"
          RELEASE_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          export IPA_SIZE DOWNLOAD_URL RELEASE_DATE MARKETING_VERSION BUILD_VERSION MIN_OS_VERSION
          python3 << 'PY'
          import json, os
          from pathlib import Path

          path = Path("apps.json")
          data = json.loads(path.read_text())
          entry = {
              "version": os.environ["MARKETING_VERSION"],
              "buildVersion": os.environ["BUILD_VERSION"],
              "date": os.environ["RELEASE_DATE"],
              "localizedDescription": f"Build {os.environ['BUILD_VERSION']} (unsigned IPA for SideStore).",
              "downloadURL": os.environ["DOWNLOAD_URL"],
              "size": int(os.environ["IPA_SIZE"]),
              "minOSVersion": os.environ["MIN_OS_VERSION"],
          }
          app = data["apps"][0]
          versions = list(app.get("versions") or [])
          already = any(
              str(v.get("version")) == entry["version"]
              and str(v.get("buildVersion")) == entry["buildVersion"]
              for v in versions
          )
          if not already:
              app["versions"] = [entry] + versions
          else:
              app["versions"] = versions
          # SideStore still expects a top-level downloadURL on the app entry.
          latest = app["versions"][0]
          app["downloadURL"] = latest["downloadURL"]
          app["version"] = latest["version"]
          app["versionDate"] = latest["date"]
          app["size"] = latest["size"]
          path.write_text(json.dumps(data, indent=2) + "\n")
          print(f"Prepended version {entry['version']} ({entry['buildVersion']}) size={entry['size']}")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps.json
          if git diff --staged --quiet; then
            echo "apps.json already up to date"
            exit 0
          fi
          # Only this auto-commit should mention the skip-ci token; do not put it
          # in regular commit messages or GitHub will skip the whole workflow.
          git commit -m "Update SideStore source for ${TAG} [skip ci]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
